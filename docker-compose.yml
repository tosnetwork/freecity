services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: freecity
      POSTGRES_PASSWORD: freecity
      POSTGRES_DB: freecity
    ports:
      # 5433 on the host to avoid colliding with a locally installed Postgres.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freecity -d freecity"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
