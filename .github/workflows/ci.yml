name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freecity
          POSTGRES_PASSWORD: freecity
          POSTGRES_DB: freecity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freecity -d freecity"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://freecity:freecity@localhost:5432/freecity
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm gate:replay
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
